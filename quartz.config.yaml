# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json

# =============================================================================
#  1. GENERAL SETTINGS
# =============================================================================
configuration:
  pageTitle: "Erduim Wiki"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true        # hover preview of linked pages
  locale: en-US
  baseUrl: "edsb11.github.io/erduimwiki"
  ignorePatterns:
    - private
    - templates
    - .obsidian

  # ---------------------------------------------------------------------------
  #  Theme: fonts and colors
  #  Colors switch automatically with the device theme (light / dark).
  # ---------------------------------------------------------------------------
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      title: MedievalSharp
      header: MedievalSharp
      body: MedievalSharp
      code: IBM Plex Mono
    colors:
      # Medieval manuscript palette: vellum page, iron-gall ink, rubric red, gold leaf
      lightMode:
        light: "#f2e6c9"        # vellum page
        lightgray: "#d9c79a"    # aged borders
        gray: "#8a7550"         # secondary text, dates
        darkgray: "#3b2a1a"     # body text (brown ink)
        dark: "#1f130a"         # headings (black ink)
        secondary: "#9b1b1b"    # links, accents (rubric red)
        tertiary: "#8a6212"     # hover (dark gold)
        highlight: "rgba(155,27,27,0.12)"
        textHighlight: "#e8c54788"
      darkMode:
        light: "#17110c"        # candlelit night page
        lightgray: "#3a2d20"
        gray: "#a8977a"         # secondary text, dates (lighter than before)
        darkgray: "#f8f3e6"     # body text (bright parchment; use "#ffffff" for pure white)
        dark: "#ffffff"         # headings
        secondary: "#f2e6c9"    # links, accents (cream)
        tertiary: "#e8d9a8"     # hover (pale gold)
        highlight: "rgba(242,230,201,0.15)"
        textHighlight: "#d9b24c55"

# =============================================================================
#  2. PLUGINS
#  Order inside each group is unchanged from your original file.
# =============================================================================
plugins:

  # ---- Markdown processing --------------------------------------------------
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92

  # ---- Fonts, theme plugin, publishing filters, site files ------------------
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  # Obsidian theme converted for Quartz. Change "theme:" to try another one.
  # Old-book / medieval candidates from the theme list (names only, preview them):
  #   manuscript, vellum, scriptorium, abecedarium, gothic, ravenloft,
  #   quest-journal, ttrpg-rathgar-gold, fancy-a-story
  # A name with a dot is "theme" + "variation", e.g. ukiyo.golden-book becomes
  #   theme: ukiyo
  #   variation: golden-book
  # To go back to your own look with no theme, set enabled: false.
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: manuscript
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true

  # ---- Page types -----------------------------------------------------------
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true

  # ---- LEFT SIDEBAR: logo + title (10), search (20), buttons (30-35), explorer (50)
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/darkmode"
    # Keep this enabled: it makes the site follow the device theme.
    # The toggle button itself is hidden in custom.scss.
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      folderDefaultState: collapsed
      folderClickBehavior: collapse
    layout:
      position: left
      priority: 50

  # ---- ABOVE THE TEXT: breadcrumbs (5), title (10), properties (15), meta (20)
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30

  # ---- RIGHT SIDEBAR: graph (10), contents (30), backlinks (50)
  #      To remove the graph, change its "enabled" below to false.
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50

  # ---- Below the text and footer --------------------------------------------
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false          # was hidden with CSS before; now simply off
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false

  # ---- Extra page features --------------------------------------------------
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # Interactive fantasy maps from the Obsidian plugin "TTRPG Tools: Maps"
  - source: github:quartz-community/obsidian-plugin-ttrpg-tools-maps
    enabled: true
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50

# =============================================================================
#  3. LAYOUT GROUPS AND PAGE-TYPE OVERRIDES
# =============================================================================
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}